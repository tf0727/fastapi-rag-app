[project]
name = "agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.1",
    "langchain-openai>=1.0,<2",
    "langchain-community>=0.4,<0.5",
    "sentence-transformers>=5,<6",
    "faiss-cpu>=1.12,<2",
    "elasticsearch>=9,<10",
    "fastapi[standard]>=0.141.1",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]
test = ["pytest>=8.3.5", "httpx>=0.27"]
server = ["langgraph-cli[inmem]>=0.4"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "xiaomi_entity"]
[tool.setuptools.package-dir]
"agent" = "src/agent"
"xiaomi_entity" = "xiaomi_entity"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
target-version = "py311"
# Local document automation is not part of this Python application.
extend-exclude = ["fill_forms.py"]

[tool.ruff.lint]
# Check correctness and imports. Console output and Chinese teaching docstrings
# are intentional in the retained examples, rather than CI failures.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These entry points initialize dotenv or sys.path before backend imports.
"add_mineru_document.py" = ["E402"]
"demo_multi_turn.py" = ["E402"]
"demo_simple_retriever.py" = ["E402"]
"src/agent/rag_agent*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.2.8",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.8.2",
]
