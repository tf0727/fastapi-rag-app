name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install application and test dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,test]"
      - name: Check Python code and imports
        run: uv run --no-sync ruff check .
      - name: Check API entry point types
        run: uv run --no-sync mypy main.py --follow-imports=skip --ignore-missing-imports
      - name: Check Python syntax
        run: uv run --no-sync python -m compileall -q main.py src xiaomi_entity tests
      - name: Run unit and HTTP integration tests (RAG backend mocked)
        run: uv run --no-sync pytest tests -q
